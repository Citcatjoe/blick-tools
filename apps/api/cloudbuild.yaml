# Construit et pousse l'image de l'API. Le déploiement (`gcloud run deploy`) est lancé ensuite par
# la personne qui déploie, avec ses propres droits : le compte Cloud Build n'a ainsi besoin d'aucun
# droit sur Cloud Run ni sur le compte de service de l'API. À lancer depuis la RACINE du monorepo :
#   gcloud builds submit --project <projet> --config apps/api/cloudbuild.yaml --substitutions=_IMAGE=<image>
# Procédure complète : apps/api/README.md.
substitutions:
  _IMAGE: ''
options:
  substitutionOption: MUST_MATCH
steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1'] # nécessaire pour apps/api/Dockerfile.dockerignore
    args: ['build', '-f', 'apps/api/Dockerfile', '-t', '${_IMAGE}', '.']
images:
  - ${_IMAGE}

    Testimony:
      type: object
      properties:
        id: { type: string }
        embedUrl: { type: string, format: uri }
        title: { type: string }
        subject: { type: string }
        question: { type: string }
        timeExpires: { type: [string, 'null'], format: date-time, description: Instant UTC ; null sans date limite. }
        views: { type: integer }

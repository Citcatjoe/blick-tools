openapi: 3.1.0
info:
  title: Blick Tools API
  version: 1.6.0
  description: |
    API serveur à serveur de Blick Tools. Appelant prévu : backend Hub Rédaction (Cloud Run).
    Formats : sondages (`/polls`, création, lecture, correction des textes) ; calendriers,
    tinders et quiz (`/calendars`, `/tinders`, `/quizzes`, création et lecture — spec 002) ;
    teasers, dossiers, NatiNotes, joueur·euse du match, faits marquants, pronostics et appels à
    témoignage (`/teasers`, `/folders`, `/natinotes`, `/potms`, `/facts`, `/pronos`,
    `/testimonies`, création et lecture — spec 005) ; envoi d'une image de widget (`/images` —
    spec 003) ; effectifs des joueurs (`/teams` — spec 005) ; modification des 11 formats
    (`PUT /<ressource>/{id}`, pré-remplie par `form` et `version` de la lecture — spec 006).

    **Règles** : celles du dashboard, partagées (`@rms/widget-model`) — un widget valide dans le
    dashboard est valide par l'API, et inversement.

    **Authentification** : `Authorization: Bearer <ID token Google>` émis pour le compte de
    service de l'appelant, avec `audience` = URL du service Blick Tools API de l'environnement
    visé. L'e-mail du compte doit figurer dans la liste blanche du service.

    **Erreurs** : RFC 9457 (`application/problem+json`), voir le schéma `Problem`. Le champ
    `code` est stable et destiné aux machines ; `title`/`detail`/`message` sont en français.
servers:
  - url: https://blick-tools-api-<hash>-ew.a.run.app
    description: Une URL par environnement (test `widget-studio-test`, prod `blick-tools-app-42a99`)
security:
  - googleIdToken: []
paths:
  /polls:
    post:
      operationId: createPoll
      summary: Créer un sondage
      description: |
        Crée un widget `poll` identique à celui que produit le dashboard pour les mêmes
        saisies, et renvoie son id et son URL d'embed. Le sondage est actif dès la création.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            Clé choisie par l'appelant (ex. UUID). Avec la même clé, la même demande renvoie le
            sondage déjà créé (`200`) ; une demande différente renvoie `409`. Propre à chaque
            appelant, sans expiration.
          schema:
            type: string
            minLength: 1
            maxLength: 255
            pattern: '^[\x21-\x7E]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePollRequest'
            example:
              question: Faut-il introduire la semaine de 4 jours en Suisse ?
              answers: [Oui, Non, Sans opinion]
              theme: Suisse
              brand: blick
              author: jane.doe@ringier.ch
      responses:
        '201':
          description: Sondage créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePollResponse'
              example:
                id: 9f2c41d07ab35e6c1d84
                embedUrl: https://storytelling.blick.ch/fr/__is_embed_somewhere/bl-tools-client-poll/?pollDoc=9f2c41d07ab35e6c1d84&brand=blick
        '200':
          description: Rejeu idempotent — le sondage existait déjà pour cette clé et ce contenu
          headers:
            Idempotent-Replayed:
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePollResponse'
        '400':
          description: |
            `INVALID_JSON` (corps illisible), `INVALID_IDEMPOTENCY_KEY` (en-tête hors format) ou
            `VALIDATION_FAILED` (toutes les violations dans `errors`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                status: 400
                code: VALIDATION_FAILED
                title: Requête invalide
                detail: 2 champ(s) invalide(s).
                errors:
                  - { field: theme, code: required, message: La rubrique est obligatoire. }
                  - { field: 'answers[1]', code: required, message: La réponse 2 est vide. }
        '401':
          description: '`UNAUTHENTICATED` — jeton absent, illisible, expiré ou mauvaise audience.'
          headers:
            WWW-Authenticate:
              schema: { type: string, example: Bearer }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: '`FORBIDDEN` — identité valide mais hors liste blanche.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: '`IDEMPOTENCY_CONFLICT` — clé déjà utilisée pour un contenu différent.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413':
          description: '`PAYLOAD_TOO_LARGE` — corps > 64 Kio.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '415':
          description: '`UNSUPPORTED_MEDIA_TYPE` — `Content-Type` autre que `application/json`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500':
          description: '`INTERNAL` — erreur inattendue ; rien n''est garanti sur l''écriture, rejouer avec la même clé.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: '`UNAVAILABLE` — stockage temporairement indisponible ; rejouable avec la même clé.'
          headers:
            Retry-After:
              schema: { type: integer, example: 5 }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /polls/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Identifiant Firestore du sondage (`meta.id`).
    get:
      operationId: getPoll
      summary: Lire un sondage
      responses:
        '200':
          description: Sondage trouvé
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/Poll' }, { $ref: '#/components/schemas/EditState' }]
        '401':
          description: '`UNAUTHENTICATED` — jeton absent, illisible, expiré ou mauvaise audience.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: '`FORBIDDEN` — identité valide mais hors liste blanche.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: '`NOT_FOUND` — document inexistant ou pas de type `poll`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: '`UNAVAILABLE` — stockage temporairement indisponible.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    patch:
      operationId: updatePoll
      summary: Corriger la question et/ou les textes des réponses
      description: |
        Gardé pour les extensions déjà en production ; `PUT` le remplace (spec 006). Ne change
        pas `meta.timeUpdated` (donc pas la `version`).
        Correction limitée : seuls `question` et les textes de `answers` changent ; les votes
        (`stats.answerCounters`) ne sont jamais écrits. `answers` doit reprendre **exactement** les
        identifiants existants, dans le même ordre (pas d'ajout, de retrait ni de
        réordonnancement). Rubrique et marque se corrigent dans le dashboard. Écriture
        transactionnelle (1 lecture + 1 écriture).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PollUpdateRequest' }
      responses:
        '200':
          description: Sondage après modification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Poll' }
        '400':
          description: '`VALIDATION_FAILED` — champ inconnu, question/réponse vide, éditeur manquant, ou identifiants de réponses différents/en nombre différent/dans un autre ordre.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: '`UNAUTHENTICATED`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: '`FORBIDDEN` — identité valide mais hors liste blanche.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: '`NOT_FOUND` — document inexistant ou pas de type `poll`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '415':
          description: '`UNSUPPORTED_MEDIA_TYPE` — `Content-Type` autre que `application/json`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: '`UNAVAILABLE` — stockage temporairement indisponible.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    put:
      operationId: editPoll
      summary: Modifier un sondage
      description: &editDescription |
        Modification complète (spec 006) : le corps est la requête de création (mêmes champs,
        mêmes règles, mêmes chemins d'erreur, `author` refusé) avec le `form` de la lecture
        modifié, plus `version` (obligatoire, celle de la lecture) et `editor` (facultatif).
        Les éléments des listes gardées (réponses de sondage, dates de calendrier qui en ont,
        cartes, questions, boutons, candidats, faits marquants) portent leur `id` : leurs
        compteurs sont conservés ; sans `id` ou avec un `id` inconnu, l'élément est nouveau
        (compteur à 0) ; un élément retiré perd son compteur. Vues et compteurs globaux gardés.
        `meta.id`, `meta.author`, `meta.timeCreated` gardés ; `meta.timeUpdated` = nouvelle
        version ; `meta.lastEditor` = `editor`. Nouvelle image importée comme à la création ;
        image inchangée gardée ; l'ancienne copie remplacée n'est **pas** supprimée du Storage.
        Écriture transactionnelle : version relue au moment d'écrire.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf: [{ $ref: '#/components/schemas/EditPollRequest' }, { $ref: '#/components/schemas/EditFields' }]
      responses: &editResponses
        '200':
          description: Modifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EditResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundForEdit' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /calendars:
    post:
      operationId: createCalendar
      summary: Créer un calendrier
      description: |
        Dates : date-heure ISO 8601. Avec décalage (`Z`, `+01:00`), l'instant est respecté ;
        sans décalage (`2026-12-20T20:45`), il est lu en heure suisse (Europe/Zurich, heure
        d'été gérée ; heure inexistante au passage à l'heure d'été refusée ; heure ambiguë du
        passage à l'heure d'hiver lue en heure d'hiver).
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCalendarRequest' }
            example:
              title: Coupe du monde 2026
              theme: Sport
              dates:
                - { text: Finale, complement: Lusail, start: '2026-12-20T20:45' }
              linkGlobal: { text: Tout le programme, href: 'https://www.blick.ch/sport', newTab: true }
      responses: &createResponses
        '201':
          description: Créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatePollResponse' }
        '200':
          description: 'Rejeu idempotent (en-tête `Idempotent-Replayed: true`)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatePollResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /calendars/{id}:
    parameters: [{ $ref: '#/components/parameters/WidgetId' }]
    get:
      operationId: getCalendar
      summary: Lire un calendrier
      responses:
        '200':
          description: Calendrier
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/Calendar' }, { $ref: '#/components/schemas/EditState' }]
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    put:
      operationId: editCalendar
      summary: Modifier un calendrier
      description: *editDescription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf: [{ $ref: '#/components/schemas/CreateCalendarRequest' }, { $ref: '#/components/schemas/EditFields' }]
      responses: *editResponses
  /tinders:
    post:
      operationId: createTinder
      summary: Créer un tinder
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTinderRequest' }
            example:
              label: Débat
              title: Pour ou contre ?
              theme: Suisse
              cards: [{ label: Énergie, title: Nucléaire }, { label: Transports, title: Péage urbain }, { label: Travail, title: Semaine de 4 jours }]
              legend: Glisse à droite pour « pour », à gauche pour « contre ».
      responses: *createResponses
  /tinders/{id}:
    parameters: [{ $ref: '#/components/parameters/WidgetId' }]
    get:
      operationId: getTinder
      summary: Lire un tinder
      responses:
        '200':
          description: Tinder
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/Tinder' }, { $ref: '#/components/schemas/EditState' }]
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    put:
      operationId: editTinder
      summary: Modifier un tinder
      description: *editDescription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf: [{ $ref: '#/components/schemas/CreateTinderRequest' }, { $ref: '#/components/schemas/EditFields' }]
      responses: *editResponses
  /quizzes:
    post:
      operationId: createQuiz
      summary: Créer un quiz
      description: |
        Image de question facultative, URL https :
        - URL rendue par `POST /images` (ou image déjà dans le Storage Blick Tools de
          l'environnement) : pas de nouveau téléchargement ; un envoi est copié pour le quiz.
          L'objet doit exister et porter le jeton de l'URL (un envoi expire après 7 jours).
        - Toute autre URL publique : l'API télécharge l'image (≤ 10 Mo, 10 s, hôtes privés
          refusés), la convertit comme le dashboard (WebP, ≤ 1928 px, ≈ 75 Ko) et en stocke une
          copie ; l'URL d'origine n'est jamais référencée.
        Image invalide ou introuvable → `400` sur `questions[i].img`, rien n'est créé.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateQuizRequest' }
            example:
              title: Connaissez-vous la Suisse ?
              theme: Suisse
              questions:
                - text: Combien de cantons compte la Suisse ?
                  img: 'https://example.com/carte.jpg'
                  answers: [{ text: '23' }, { text: '26', isCorrect: true }, { text: '24' }, { text: '20' }]
              conclusion: { text1: Révisez !, text2: Pas mal., text3: Bravo ! }
      responses: *createResponses
  /quizzes/{id}:
    parameters: [{ $ref: '#/components/parameters/WidgetId' }]
    get:
      operationId: getQuiz
      summary: Lire un quiz
      responses:
        '200':
          description: Quiz
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/Quiz' }, { $ref: '#/components/schemas/EditState' }]
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    put:
      operationId: editQuiz
      summary: Modifier un quiz
      description: *editDescription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf: [{ $ref: '#/components/schemas/CreateQuizRequest' }, { $ref: '#/components/schemas/EditFields' }]
      responses: *editResponses
  /teasers:
    post:
      operationId: createTeaser
      summary: Créer un teaser
      description: |
        Image obligatoire (`img`), traitée comme l'image d'une question de quiz (`POST /quizzes`) :
        URL de `POST /images` copiée, toute autre URL https téléchargée et convertie ; copie
        stockée sous `teasers/`. Image invalide ou introuvable → `400` sur `img`, rien n'est créé.
        Le titre garde ses retours à la ligne.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTeaserRequest' }
            example:
              label: Dossier
              title: "Tout sur les votations\ndu 30 novembre"
              img: 'https://example.com/votations.jpg'
              button: { text: Lire le dossier, href: 'https://www.blick.ch/fr/politique', newTab: false }
              theme: Suisse
      responses: *createResponses
  /teasers/{id}:
    parameters: [{ $ref: '#/components/parameters/WidgetId' }]
    get:
      operationId: getTeaser
      summary: Lire un teaser
      responses:
        '200':
          description: Teaser
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/Teaser' }, { $ref: '#/components/schemas/EditState' }]
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    put:
      operationId: editTeaser
      summary: Modifier un teaser
      description: *editDescription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf: [{ $ref: '#/components/schemas/CreateTeaserRequest' }, { $ref: '#/components/schemas/EditFields' }]
      responses: *editResponses
  /folders:
    post:
      operationId: createFolder
      summary: Créer un dossier
      description: |
        Image obligatoire (`img`), traitée comme pour un teaser ; copie stockée sous `folders/`.
        De 1 à 4 boutons, texte et adresse http(s) obligatoires.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFolderRequest' }
            example:
              label: Dossier
              labelColor: sport
              name: "Coupe du monde\n2026"
              img: 'https://example.com/coupe.jpg'
              buttons:
                - { text: Le programme, href: 'https://www.blick.ch/fr/sport/programme' }
                - { text: Les groupes, href: 'https://www.blick.ch/fr/sport/groupes', newTab: true }
              theme: Sport
      responses: *createResponses
  /folders/{id}:
    parameters: [{ $ref: '#/components/parameters/WidgetId' }]
    get:
      operationId: getFolder
      summary: Lire un dossier
      responses:
        '200':
          description: Dossier
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/Folder' }, { $ref: '#/components/schemas/EditState' }]
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    put:
      operationId: editFolder
      summary: Modifier un dossier
      description: *editDescription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf: [{ $ref: '#/components/schemas/CreateFolderRequest' }, { $ref: '#/components/schemas/EditFields' }]
      responses: *editResponses
  /natinotes:
    post:
      operationId: createNatinotes
      summary: Créer des NatiNotes (notes des joueurs)
      description: |
        Joueurs choisis dans les effectifs (`GET /teams`) par leur `id`, sans doublon. Nom,
        équipe, portrait et cadrage sont copiés depuis l'effectif au moment de la création.
        Joueur inconnu ou archivé → `400` sur `players[i].id`. `comment` : HTML restreint
        (`<p>`, `<br>`, `<strong>`, `<em>`, `<a href="http(s)…">`), le reste est échappé ou
        retiré ; vide après nettoyage → `400`. Pas d'image envoyée.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateNatinotesRequest' }
            example:
              title: Suisse – Kosovo (2-0)
              showRecap: true
              players:
                - { id: granit-xhaka, blickRating: 5, comment: '<p>Le patron du milieu, <strong>impérial</strong>.</p>' }
              theme: Sport
      responses: *createResponses
  /natinotes/{id}:
    parameters: [{ $ref: '#/components/parameters/WidgetId' }]
    get:
      operationId: getNatinotes
      summary: Lire des NatiNotes
      responses:
        '200':
          description: NatiNotes
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/Natinotes' }, { $ref: '#/components/schemas/EditState' }]
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    put:
      operationId: editNatinotes
      summary: Modifier des NatiNotes
      description: *editDescription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf: [{ $ref: '#/components/schemas/CreateNatinotesRequest' }, { $ref: '#/components/schemas/EditFields' }]
      responses: *editResponses
  /potms:
    post:
      operationId: createPotm
      summary: Créer un joueur·euse du match
      description: |
        `date` : date seule (`2026-12-20`), enregistrée à midi heure suisse. Au moins 2 joueurs ;
        `team` parmi les équipes du contexte choisi (`optionsBy` de la description) ; `position`
        neutre, accordée selon la catégorie à l'enregistrement (Dames → Attaquante…). Pas d'image.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePotmRequest' }
            example:
              context: national
              category: Messieurs
              text: Suisse – Kosovo
              date: '2026-12-20'
              players:
                - { name: Granit Xhaka, position: Milieu, team: Suisse }
                - { name: Gregor Kobel, position: Gardien, team: Suisse }
              theme: Sport
      responses: *createResponses
  /potms/{id}:
    parameters: [{ $ref: '#/components/parameters/WidgetId' }]
    get:
      operationId: getPotm
      summary: Lire un joueur·euse du match
      responses:
        '200':
          description: Joueur·euse du match
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/Potm' }, { $ref: '#/components/schemas/EditState' }]
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    put:
      operationId: editPotm
      summary: Modifier un·e joueur·euse du match
      description: *editDescription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf: [{ $ref: '#/components/schemas/CreatePotmRequest' }, { $ref: '#/components/schemas/EditFields' }]
      responses: *editResponses
  /facts:
    post:
      operationId: createFacts
      summary: Créer des faits marquants
      description: |
        `date` : date seule, enregistrée à midi heure suisse. Au moins un item ; au plus un item
        `rating`. Champs selon `type` (variantes de la description) ; un champ d'un autre type →
        `400 unknown_field` sur son chemin. Textes `richtext` nettoyés comme pour les NatiNotes
        (`quote` : sans paragraphes). Images `items[i].src` (`picture`, obligatoire) et
        `items[i].picture` (`quote`, facultative) traitées comme pour un teaser ; copies sous
        `factss/` (préfixe du dashboard). Image invalide → `400` sur son chemin.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFactsRequest' }
            example:
              title: Suisse – Kosovo
              date: '2026-12-20'
              items:
                - { type: normal, icon: iconEye, title: Le fait du match, text: '<p>Xhaka a touché 120 ballons.</p>' }
                - { type: number, icon: iconHashtag, title: En chiffres, value: 3, text: buts en 10 minutes }
                - { type: rating, title: Quelle note donneriez-vous à cette rencontre ? }
              theme: Sport
      responses: *createResponses
  /facts/{id}:
    parameters: [{ $ref: '#/components/parameters/WidgetId' }]
    get:
      operationId: getFacts
      summary: Lire des faits marquants
      responses:
        '200':
          description: Faits marquants
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/Facts' }, { $ref: '#/components/schemas/EditState' }]
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    put:
      operationId: editFacts
      summary: Modifier des faits marquants
      description: *editDescription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf: [{ $ref: '#/components/schemas/CreateFactsRequest' }, { $ref: '#/components/schemas/EditFields' }]
      responses: *editResponses
  /pronos:
    post:
      operationId: createProno
      summary: Créer un pronostic
      description: |
        `event` parmi les compétitions de la description ; `team1` / `team2` parmi les équipes
        nationales (les deux peuvent être identiques, comme dans le dashboard). `date` : date
        seule, enregistrée à midi heure suisse. Équipes complétées à l'enregistrement (code,
        couleur de l'équipe) ; un vote posé sur chaque issue (équipe 1, équipe 2, match nul), comme
        le dashboard. Pas d'image. La couleur des barres reste réglable dans le dashboard seul.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePronoRequest' }
            example:
              event: Coupe du monde UEFA 2026
              date: '2026-06-15'
              team1: Suisse
              team2: Canada
              theme: Sport
      responses: *createResponses
  /pronos/{id}:
    parameters: [{ $ref: '#/components/parameters/WidgetId' }]
    get:
      operationId: getProno
      summary: Lire un pronostic
      responses:
        '200':
          description: Pronostic
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/Prono' }, { $ref: '#/components/schemas/EditState' }]
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    put:
      operationId: editProno
      summary: Modifier un pronostic
      description: *editDescription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf: [{ $ref: '#/components/schemas/CreatePronoRequest' }, { $ref: '#/components/schemas/EditFields' }]
      responses: *editResponses
  /testimonies:
    post:
      operationId: createTestimony
      summary: Créer un appel à témoignage
      description: |
        `timeExpires` (facultatif) : date et heure suisses sans décalage (`2026-12-20T20:45`),
        comme `dates[i].start` d'un calendrier ; absent → pas de date limite. Pas d'image.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTestimonyRequest' }
            example:
              title: Votre avis nous intéresse
              subject: Hausse des primes maladie
              question: Comment faites-vous face à la hausse de vos primes ? Racontez-nous.
              timeExpires: '2026-12-20T20:45'
              theme: Suisse
      responses: *createResponses
  /testimonies/{id}:
    parameters: [{ $ref: '#/components/parameters/WidgetId' }]
    get:
      operationId: getTestimony
      summary: Lire un appel à témoignage
      description: |
        Textes, date limite et compteurs seulement : les messages des lecteurs (données
        personnelles) ne sont jamais renvoyés ; ils s'exportent depuis le dashboard.
      responses:
        '200':
          description: Appel à témoignage
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/Testimony' }, { $ref: '#/components/schemas/EditState' }]
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    put:
      operationId: editTestimony
      summary: Modifier un appel à témoignage
      description: *editDescription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf: [{ $ref: '#/components/schemas/CreateTestimonyRequest' }, { $ref: '#/components/schemas/EditFields' }]
      responses: *editResponses
  /images:
    post:
      operationId: uploadImage
      summary: Envoyer l'image d'un widget (fichier brut)
      description: |
        Corps = le fichier, sans JSON ni multipart. Même traitement qu'une image importée par URL
        (WebP, ≤ 1928 px, ≈ 75 Ko). L'`url` rendue s'utilise telle quelle dans tout champ image
        d'une création (`kind: image` de `GET /widget-types` : `questions[i].img` d'un quiz, `img`
        d'un teaser ou d'un dossier, `items[i].src` / `items[i].picture` des faits marquants). Un
        envoi jamais utilisé est supprimé après 7 jours ; le widget en garde sa propre copie, sous
        le préfixe de son format (`images.prefix` de la description).
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
          image/gif: { schema: { type: string, format: binary } }
      responses:
        '201':
          description: Image enregistrée.
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri, example: 'https://firebasestorage.googleapis.com/v0/b/<bucket>/o/hub-uploads%2F1764230400000_<uuid>.webp?alt=media&token=<uuid>' }
        '400':
          description: |
            `VALIDATION_FAILED`, `errors: [{ field: "image", code, message }]` : `invalid_type`
            (pas une image, ou format hors JPEG/PNG/WebP/GIF — le format réel est vérifié),
            `too_large` (> 10 Mo), `invalid_value` (image illisible).
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { description: '`METHOD_NOT_ALLOWED` (`Allow: POST`).' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /widget-types:
    get:
      operationId: getWidgetTypes
      summary: Description des formulaires de création (spec 004)
      description: |
        Formats ouverts à l'API, dans l'ordre d'affichage du Hub, avec pour chaque champ de la
        requête : type de saisie, libellé et exemple en français, obligation, bornes. Source :
        `WIDGET_FORMS` de `@rms/widget-model`. Les champs acceptés par les créations sont ceux de
        cette description, plus `theme`, `brand` et `author`. Les règles restent celles des
        `POST` (erreurs `400`) ; des tests vérifient que la description les reflète.
      responses:
        '200':
          description: Description des formats.
          content:
            application/json:
              schema:
                type: object
                required: [formats]
                properties:
                  formats: { type: array, items: { $ref: '#/components/schemas/WidgetForm' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { description: '`METHOD_NOT_ALLOWED` (`Allow: GET`).' }
  /teams:
    get:
      operationId: getTeams
      summary: Effectifs des joueurs (spec 005)
      description: |
        Joueurs proposés par les NatiNotes (`choice` + `source: teams` de la
        description) : collection `teams` du dashboard (« Éditer les effectifs »), joueurs
        archivés exclus, équipes triées par nom, joueurs par nom. Source : `listTeamsForPicker`
        de `@rms/widget-model`. Lecture seule.
      responses:
        '200':
          description: Effectifs.
          content:
            application/json:
              schema:
                type: object
                required: [teams]
                properties:
                  teams: { type: array, items: { $ref: '#/components/schemas/PickerTeam' } }
              example:
                teams:
                  - id: suisse-m-football
                    name: Suisse M – Football
                    players:
                      - { id: granit-xhaka, name: Granit Xhaka, team: Suisse, img: 'https://firebasestorage.googleapis.com/v0/b/<bucket>/o/portraits%2F1_granit-xhaka.webp?alt=media&token=<uuid>', focal: { x: 50, y: 0, zoom: 1 } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { description: '`METHOD_NOT_ALLOWED` (`Allow: GET`).' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  securitySchemes:
    googleIdToken:
      type: http
      scheme: bearer
      bearerFormat: JWT (Google-signed OIDC ID token)
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Même règle que `POST /polls` ; la clé est propre à l'appelant et au format.
      schema: { type: string, minLength: 1, maxLength: 255, pattern: '^[\x21-\x7E]+$' }
    WidgetId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Identifiant Firestore du widget (`?<type>Doc=` de l'URL d'embed).
  responses:
    BadRequest:
      description: '`VALIDATION_FAILED` (toutes les violations dans `errors`), `INVALID_JSON` ou `INVALID_IDEMPOTENCY_KEY`.'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unauthenticated:
      description: '`UNAUTHENTICATED`.'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Forbidden:
      description: '`FORBIDDEN` — identité hors liste blanche.'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotFound:
      description: '`NOT_FOUND` — inexistant ou d''un autre format.'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Conflict:
      description: '`IDEMPOTENCY_CONFLICT`.'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    VersionConflict:
      description: '`VERSION_CONFLICT` — widget modifié entre-temps (Studio, Hub ou autre) : relire puis refaire la modification.'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotFoundForEdit:
      description: '`NOT_FOUND` — inexistant, supprimé (`meta.deleted`) ou d''un autre format.'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    TooLarge:
      description: '`PAYLOAD_TOO_LARGE` — corps > 64 Kio.'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    UnsupportedMediaType:
      description: '`UNSUPPORTED_MEDIA_TYPE`.'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unavailable:
      description: '`UNAVAILABLE` — Firestore ou Storage temporairement indisponible ; rejouer avec la même clé.'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    CreatePollRequest:
      type: object
      additionalProperties: false
      required: [question, answers, theme]
      properties:
        question:
          type: string
          description: Question du sondage ; rognée, non vide.
        answers:
          type: array
          minItems: 2
          description: Réponses dans l'ordre d'affichage ; chacune rognée, non vide.
          items: { type: string }
        theme:
          type: string
          enum: [Suisse, Inter, Sport]
          description: Rubrique (casse exacte).
        brand:
          type: string
          enum: [blick, pme]
          default: blick
          description: Marque. `pme` active l'intégration hôte PME dans l'URL d'embed.
        author:
          type: string
          format: email
          maxLength: 254
          description: E-mail du journaliste, affiché comme auteur dans le dashboard. Défaut « Hub Rédaction ».
    CreatePollResponse:
      type: object
      required: [id, embedUrl]
      properties:
        id:
          type: string
          description: Identifiant Firestore du widget (`?pollDoc=`).
        embedUrl:
          type: string
          format: uri
          description: URL de l'iframe, identique au lien copié depuis le dashboard.
    Poll:
      type: object
      required: [id, embedUrl, question, answers, totalVotes, theme, brand]
      properties:
        id: { type: string }
        embedUrl: { type: string, format: uri }
        question: { type: string }
        answers:
          type: array
          description: Réponses dans l'ordre d'affichage ; `votes` lu dans `stats.answerCounters`, 0 si absent.
          items: { $ref: '#/components/schemas/PollAnswer' }
        totalVotes:
          type: integer
          description: Somme des votes des réponses listées.
        theme: { type: string }
        brand: { type: string, enum: [blick, pme] }
    PollAnswer:
      type: object
      required: [id, text, votes]
      properties:
        id: { type: string }
        text: { type: string }
        votes: { type: integer }
    PollUpdateRequest:
      type: object
      additionalProperties: false
      required: [editor]
      properties:
        question:
          type: string
          description: Nouvelle question ; rognée, non vide si fournie.
        answers:
          type: array
          description: Textes dans le même ordre que les réponses existantes ; `id` = identifiant existant, non modifiable.
          items:
            type: object
            additionalProperties: false
            required: [id, text]
            properties:
              id: { type: string }
              text: { type: string }
        editor:
          type: string
          description: E-mail du journaliste, conservé comme trace (`meta.updatedBy`).
    EditState:
      type: object
      required: [form, version]
      properties:
        form:
          type: object
          description: |
            Requête de modification pré-remplie : mêmes clés et formes que la requête de création
            du format (dates `YYYY-MM-DD` / `YYYY-MM-DDTHH:mm` heure suisse, vrais retours à la
            ligne, HTML restreint des `richtext`, images = URL https du Storage), sans `author` ;
            valeurs facultatives vides absentes. Les éléments des listes gardées portent leur `id`.
        version:
          type: string
          description: '`meta.timeUpdated` en ISO 8601 (chaîne vide si illisible), à renvoyer telle quelle avec `PUT`. Les votes des lecteurs ne la changent pas.'
          example: '2026-11-27T10:15:30.123Z'
    EditFields:
      type: object
      required: [version]
      properties:
        version: { type: string, description: '`version` lue avec `form`.' }
        editor: { type: string, format: email, maxLength: 254, description: 'E-mail du journaliste (`meta.lastEditor`). Défaut « Hub Rédaction ».' }
      description: |
        Champs propres à `PUT`. `author` est refusé (`unknown_field`) : l'auteur est conservé. Dans
        les listes gardées, chaque élément accepte en plus `id` (chaîne) : `dates[i].id`,
        `cards[i].id`, `questions[i].id`, `buttons[i].id`, `players[i].id` (joueur·euse du match),
        `items[i].id` ; NatiNotes : `players[i].id` est déjà l'id du joueur.
    EditPollRequest:
      type: object
      required: [question, answers, theme]
      properties:
        question: { type: string }
        answers:
          type: array
          minItems: 2
          description: Réponse gardée `{ id, text }`, nouvelle réponse = texte (ou `{ text }`).
          items:
            oneOf:
              - { type: string }
              - { type: object, additionalProperties: false, required: [text], properties: { id: { type: string }, text: { type: string } } }
        theme: { type: string, enum: [Suisse, Inter, Sport] }
        brand: { type: string, enum: [blick, pme], default: blick }
    EditResponse:
      type: object
      required: [id, embedUrl, version]
      properties:
        id: { type: string }
        embedUrl: { type: string, format: uri }
        version: { type: string, description: Nouvelle version, pour une modification suivante. }
    WidgetCommonFields:
      type: object
      properties:
        theme: { type: string, enum: [Suisse, Inter, Sport], description: Rubrique (obligatoire). }
        brand: { type: string, enum: [blick], default: blick, description: Seule la marque blick est admise pour ces formats. }
        author: { type: string, format: email, maxLength: 254, description: Défaut « Hub Rédaction ». }
    CreateCalendarRequest:
      allOf: [{ $ref: '#/components/schemas/WidgetCommonFields' }]
      type: object
      unevaluatedProperties: false
      required: [title, theme, dates]
      properties:
        title: { type: string, description: Titre du calendrier, non vide. }
        dates:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [text, start]
            properties:
              text: { type: string }
              complement: { type: string }
              start: { type: string, description: 'ISO 8601 date-heure ; sans décalage = heure suisse.', example: '2026-12-20T20:45' }
        nbElemsToShow: { type: integer, minimum: 1, maximum: 10, description: Absent = toutes les dates. }
        linkGlobal:
          type: object
          additionalProperties: false
          required: [text, href]
          properties:
            text: { type: string }
            href: { type: string, pattern: '^https?://' }
            newTab: { type: boolean, default: false }
    Calendar:
      type: object
      properties:
        id: { type: string }
        embedUrl: { type: string, format: uri }
        title: { type: string }
        dates:
          type: array
          items:
            type: object
            properties:
              text: { type: string }
              complement: { type: string }
              start: { type: [string, 'null'], format: date-time, description: Instant en UTC. }
        nbElemsToShow: { type: [integer, 'null'], description: 100 = toutes. }
        linkGlobal:
          oneOf:
            - type: 'null'
            - type: object
              properties: { text: { type: string }, href: { type: string }, newTab: { type: boolean } }
        views: { type: integer }
        seeAllClicks: { type: integer }
        theme: { type: string }
        brand: { type: string }
    CreateTinderRequest:
      allOf: [{ $ref: '#/components/schemas/WidgetCommonFields' }]
      type: object
      unevaluatedProperties: false
      required: [label, title, theme, cards]
      properties:
        label: { type: string }
        title: { type: string }
        cards:
          type: array
          description: Exactement 3 cartes, comme le formulaire du dashboard (`too_few` / `too_many`).
          minItems: 3
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [label, title]
            properties: { label: { type: string }, title: { type: string } }
        legend: { type: string, description: Légende affichée sous les cartes (facultative). }
    Tinder:
      type: object
      properties:
        id: { type: string }
        embedUrl: { type: string, format: uri }
        label: { type: string }
        title: { type: string }
        cards:
          type: array
          items:
            type: object
            properties:
              id: { type: [string, 'null'] }
              label: { type: string }
              title: { type: string }
              yes: { type: integer }
              no: { type: integer }
        legend: { type: [string, 'null'], description: 'Légende affichée ; `null` si aucune.' }
        views: { type: integer }
        theme: { type: string }
        brand: { type: string }
    CreateQuizRequest:
      allOf: [{ $ref: '#/components/schemas/WidgetCommonFields' }]
      type: object
      unevaluatedProperties: false
      required: [title, theme, questions, conclusion]
      properties:
        title: { type: string }
        questions:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [text, answers]
            properties:
              text: { type: string }
              hint: { type: string }
              hidePercent: { type: boolean, default: false }
              img: { type: string, format: uri, description: URL https ; copiée par l'API. }
              answers:
                type: array
                minItems: 4
                maxItems: 4
                description: 'Exactement une réponse avec `isCorrect: true`.'
                items:
                  type: object
                  additionalProperties: false
                  required: [text]
                  properties: { text: { type: string }, isCorrect: { type: boolean, default: false } }
        conclusion:
          type: object
          additionalProperties: false
          required: [text1, text2, text3]
          description: Textes selon le score (0–33 %, 34–66 %, 67–100 %), tous obligatoires.
          properties: { text1: { type: string }, text2: { type: string }, text3: { type: string } }
    Quiz:
      type: object
      properties:
        id: { type: string }
        embedUrl: { type: string, format: uri }
        title: { type: string }
        questions:
          type: array
          items:
            type: object
            properties:
              id: { type: [string, 'null'] }
              text: { type: string }
              hint: { type: string }
              img: { type: string, description: URL de la copie dans le Storage Blick Tools. }
              hidePercent: { type: boolean }
              answers: { type: array, items: { type: object, properties: { text: { type: string }, isCorrect: { type: boolean } } } }
              correct: { type: integer }
              incorrect: { type: integer }
        conclusion: { type: object, properties: { text1: { type: string }, text2: { type: string }, text3: { type: string } } }

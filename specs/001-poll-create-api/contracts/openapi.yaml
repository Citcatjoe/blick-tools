    PickerTeam:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        players:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              team: { type: string }
              img: { type: [string, 'null'] }
              focal: { type: object, properties: { x: { type: number }, y: { type: number }, zoom: { type: number } } }
    WidgetForm:
      type: object
      required: [type, resource, name, noun, titleField, brands, fields]
      properties:
        type: { type: string, example: tinder, description: 'Type du widget (`?<type>Doc=` de l''URL d''embed).' }
        resource: { type: string, example: tinders, description: 'Ressource de création et de lecture.' }
        name: { type: string, example: Tinder }
        noun: { type: string, example: tinder, description: 'Nom dans une phrase (« Création du tinder »).' }
        titleField:
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }
          example: title
          description: 'Champ qui identifie le widget (titre de l''Embeddable), ou liste de champs joints par « - » (pronostic : team1, team2).'
        brands: { type: array, items: { type: string }, example: [blick] }
        fields: { type: array, items: { $ref: '#/components/schemas/FormField' } }
        images:
          type: object
          description: 'Formats avec images : préfixe Storage des copies (`quizs`, `teasers`, `folders`, `factss`).'
          properties: { prefix: { type: string } }
    FormField:
      type: object
      required: [kind]
      properties:
        key: { type: string, description: 'Nom du champ dans la requête (absent pour l''élément texte d''une liste, `item`).' }
        kind:
          type: string
          enum: [text, textarea, url, datetime, date, number, richtext, checkbox, image, choice, list, group]
          description: |
            `datetime` : date et heure suisses sans décalage (`2026-12-20T20:45`) ; `date` : date seule
            (`2026-12-20`, midi heure suisse) ; `number` : entier (`min` / `max` facultatifs) ;
            `richtext` : HTML restreint (`<p>`, `<br>`, `<strong>`, `<em>`, `<a href>`), `inline` :
            sans paragraphes ; outils gras, italique, lien ; `image` : URL https, de préférence rendue
            par `POST /images` ; `choice` : `options`, ou `source: teams` (joueurs de `GET /teams`,
            groupés par équipe), ou `dependsOn` + `optionsBy` (options selon la valeur d'un champ
            racine) ; `list` : `fields` (objets) ou `item` (textes), `variants` (éléments typés) ;
            `group` : objet `fields`.
        label: { type: string }
        placeholder: { type: string }
        required: { type: boolean }
        default: { description: 'Valeur proposée au départ.' }
        options:
          type: array
          items: { type: object, properties: { value: {}, label: { type: string } } }
        emptyLabel: { type: string, description: 'Choix « vide » (champ absent de la requête), ex. « Toutes ».' }
        min: { type: integer }
        max: { type: [integer, 'null'], description: '`null` : sans maximum.' }
        itemLabel: { type: string, example: Carte }
        addLabel: { type: string, example: Ajouter une date }
        correct: { type: string, example: isCorrect, description: 'Clé booléenne vraie sur un seul élément ; erreur sur `<parent>.correctAnswer`.' }
        optional: { type: boolean, description: 'Groupe facultatif : absent si tous ses textes sont vides.' }
        inline: { type: boolean, description: '`richtext` sans paragraphes (`<br>` seulement).' }
        source: { type: string, enum: [teams], description: '`choice` dont les options sont les joueurs de `GET /teams`.' }
        dependsOn: { type: string, description: '`choice` : clé racine dont dépendent les options (`optionsBy`).' }
        optionsBy:
          type: object
          description: '`choice` : options par valeur du champ `dependsOn`.'
          additionalProperties: { type: array, items: { type: object, properties: { value: {}, label: { type: string } } } }
        variants:
          type: object
          description: |
            `list` d'éléments typés : chaque élément porte la clé `key` (ex. `type`), les champs
            communs `fields` de la liste puis ceux de sa variante. `max` : nombre maximum d'éléments
            de la variante ; `defaults` : valeurs posées quand on choisit la variante.
          properties:
            key: { type: string, example: type }
            label: { type: string }
            options:
              type: array
              items:
                type: object
                properties:
                  value: { type: string }
                  label: { type: string }
                  max: { type: integer }
                  fields: { type: array, items: { $ref: '#/components/schemas/FormField' } }
                  defaults: { type: object }
        item: { $ref: '#/components/schemas/FormField' }
        fields: { type: array, items: { $ref: '#/components/schemas/FormField' } }
    Problem:
      type: object
      required: [status, code, title]
      properties:
        status: { type: integer }
        code:
          type: string
          enum:
            - INVALID_JSON
            - INVALID_IDEMPOTENCY_KEY
            - VALIDATION_FAILED
            - UNAUTHENTICATED
            - FORBIDDEN
            - NOT_FOUND
            - METHOD_NOT_ALLOWED
            - IDEMPOTENCY_CONFLICT
            - VERSION_CONFLICT
            - PAYLOAD_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - UNAVAILABLE
            - INTERNAL
        title: { type: string }
        detail: { type: string }
        errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          description: 'Chemin du champ, ex. `question`, `answers[i]`, `dates[i].start`, `cards[i].label`, `legend`, `questions[i].answers[j].text`, `questions[i].correctAnswer`, `questions[i].img`, `conclusion.text1`, `linkGlobal.href`, `img`, `button.href`, `buttons[i].href`, `players[i].id`, `players[i].team`, `items[i].text`, `items[i].src`, `date`, `theme`, `brand`, `author`, `editor`, `version`, `cards[i].id` (`PUT`), `image` (`POST /images`), `body` (corps non objet), ou le chemin d''un champ inconnu (indices base 0).'
        code:
          type: string
          enum: [required, invalid_type, invalid_value, too_few, too_many, too_large, duplicate, unknown_field]
        message: { type: string }
